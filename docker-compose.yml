name: instaclone

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: instaclone
      POSTGRES_PASSWORD: instaclone
      POSTGRES_USER: instaclone
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U instaclone -d instaclone']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: instaclone
      MINIO_ROOT_PASSWORD: instaclone-local-secret
    ports:
      - '${MINIO_API_HOST_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_HOST_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 instaclone instaclone-local-secret &&
        mc mb --ignore-existing local/instaclone-media
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      API_PORT: 4000
      API_CORS_ORIGINS: http://localhost:${WEB_HOST_PORT:-3000}
      AUTH_ACCESS_TOKEN_SECRET: local-access-secret-change-me-at-least-32-characters
      AUTH_REFRESH_TOKEN_PEPPER: local-refresh-pepper-change-me-at-least-32-characters
      AUTH_COOKIE_SECURE: 'false'
      DATABASE_URL: postgresql://instaclone:instaclone@postgres:5432/instaclone?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: instaclone
      S3_SECRET_KEY: instaclone-local-secret
      S3_BUCKET: instaclone-media
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '${API_HOST_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/v1/health/ready']
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  workers:
    build:
      context: .
      dockerfile: infra/docker/workers.Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 4
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_HOST_PORT:-4000}/api/v1
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://api:4000/api/v1
    ports:
      - '${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000']
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
  redis-data:
