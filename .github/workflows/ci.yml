name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: instaclone
          POSTGRES_PASSWORD: instaclone
          POSTGRES_USER: instaclone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U instaclone -d instaclone"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @instaclone/api db:migrate:deploy
        env:
          DATABASE_URL: postgresql://instaclone:instaclone@localhost:5432/instaclone?schema=public
      - run: pnpm test
        env:
          RUN_POSTGRES_INTEGRATION: 'true'
          TEST_DATABASE_URL: postgresql://instaclone:instaclone@localhost:5432/instaclone?schema=public
      - run: pnpm build
      - run: docker compose config --quiet
